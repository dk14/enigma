    <script>
        
        const v = (ctx) => {
            if (!ctx.counter) ctx.counter = 0
            ctx.counter++
            return ctx.counter
        }

        const and = (...arr) => {
            return {
                op: 'and',
                data: arr
            }
        }

        const or = (...arr) => {
            return {
                op: 'or',
                data: arr
            }
        }

        const not = (exp) => {
            return {
                op: 'not',
                exp: exp
            }
        }

    <script>
        // High-level DSL for algorithms

        const one = (templateVar = 1) => {
            return or(templateVar, not(templateVar))
        }

        const zero = (templateVar = 1) => {
            return and(templateVar, not(templateVar))
        }

        const xor = (a, b) => {
            return or(and(a, not(b)), and(not(a), b))
        }

        const allocateArray = (n, ctx) => {
            return Array(n).fill(0).map(x => v(ctx))
        }

        const andArrays = (arr1, arr2) => {
            return arr1.map((x, i) => and(x, arr2[i]))
        }

        const orArrays = (arr1, arr2) => {
            return arr1.map((x, i) => or(x, arr2[i]))
        }

        const xorArrays = (arr1, arr2) => {
            return arr1.map((x, i) => xor(x, arr2[i]))
        }

        const shiftArray = (arr, k) => {
            return arr.map((x, i) => arr[x+k] ?? 0)
        }

        const numberToArray = (num, k, templateVar = 1) => {
            return num.toString(2).padStart(k, '0').split('').map(x => x === '1' ? one(templateVar) : zero(templateVar))
        }

        const solutionToNum = (exp, n) => {
            const bitarray = []
            exp.data.forEach(x => {
                if (isVal(x)) {
                    bitarray[x - 1] = 1
                }
                if (isNotVal(x)) {
                    bitarray[x.exp - 1] = 0
                }
            })

            for (i = 0; i <= n; i++) {
                if (!bitarray[i]) {
                    bitarray[i] = 0
                }
            }
            const str = bitarray.map(x => x.toString()).join()
            //console.log(str)
            return parseInt(str, 2)
        }

        const eqArrays = (arr1, arr2) => {
            return and(...arr1.map((x, i) => not(xor(x, arr2[i]))))
        }




    </script>
    <script>

        const denot = (exp) => { //todo: fix
            if (exp.op === 'not') {
                if (exp.exp.op === 'or') {
                    return {
                        op: 'and',
                        data: exp.exp.data.map(x => denot(not(x)))
                    }
                } else if (exp.exp.op === 'and'){
                    return {
                        op: 'or',
                        data: exp.exp.data.map(x => denot(not(x)))
                    }
                } else if (exp.exp.op === 'not'){
                    return denot(exp.exp.exp)
                } else {
                    return exp
                }
            } else {
                if (exp.op) {
                    return {
                        op: exp.op,
                        data: exp.data.map(x => denot(x))
                    }
                } else {
                    return exp
                }
                
            }
        }

        const collapseBraces = (exp) => {
            if (exp.op === 'or') {
                exp.data = exp.data.map(x => {
                    if (x.op === 'or') {
                        return x.data.map(x => collapseBraces(x))
                    } else return collapseBraces(x)
                }).flat()
            }
                    
            if (exp.op === 'and') {
                exp.data = exp.data.map(x => {
                    if (x.op === 'and') {
                        return x.data.map(x => collapseBraces(x))
                    } else return collapseBraces(x)
                }).flat()
            }

            if (exp.op === 'not' && exp.exp.op !== undefined) return collapseBraces(denot(exp))

            return exp

        }

        const isVal = exp => !exp.op
        const isNotVal = exp => exp.op === 'not'
        const isSomeVal = exp => isVal(exp) || isNotVal(exp)

        const checkContradiction = (exp, outerAndPositive, outerAndNegative) => {
            if (!(isSomeVal(exp))) {
                return solve(exp, outerAndPositive, outerAndNegative)
            } else {
   
                if (isNotVal(exp) && outerAndPositive.find(x => exp.exp !== undefined && exp.exp === x)) {
                    return undefined
                }

                if (isVal(exp) && outerAndNegative.find(x => exp.exp === x)) {
                    return undefined
                }

                return solve(exp, outerAndPositive, outerAndNegative)
            }
        }

        //todo: fix leaf contradictions in extra
        const solve = (exp, outerAndPositive = [], outerAndNegative = [], k = 1) => {
            //collapse every OR by selecting first expression that does not contain inversion from outer ands
            
            //console.log("[[[[" + JSON.stringify(show(exp)))

            if (!exp.op) { 
                if (outerAndNegative.some(x => x === exp)) return undefined
                outerAndPositive.push(exp)
                return exp
            }

            if (exp.op === 'not') {
                if (exp.exp.op) throw "needs denot!"
                if (outerAndPositive.some(x => x === exp.exp)) return undefined
                outerAndNegative.push(exp.exp)
                return exp
            }

            if (exp.op === 'and') {
                //console.log("+++++")

                const extra = exp.data.filter(x => isSomeVal(x))
                const toSolve = exp.data.filter(x => !isSomeVal(x))

                extra.filter(x => isVal(x)).forEach(x => outerAndPositive.push(x))
                extra.filter(x => isNotVal(x)).forEach(x => outerAndNegative.push(x))

                const positions = toSolve.map(_ => 1)

                const limits = toSolve.map(exp => exp.data.length)

                const toStop = () => {
                    return positions.every((x, i) => x === limits[i])
                }

                const solveRest = () => {
                    console.log("positions = " + positions)
                    const tryOuterAndPositive = structuredClone(outerAndPositive)
                    const tryOuterAndNegative = structuredClone(outerAndNegative)

                    let result = []
                    let i = 0
                    for(x of toSolve) {
                        
                        const res = solve(x, tryOuterAndPositive, tryOuterAndNegative, positions[i])

                        if (res) {  
  
             

                            const negativeSet = new Set(outerAndNegative)
                            const positiveSet = new Set(outerAndPositive)
                            
                            if (res.filter) {
                                //console.log("999999")

                                 //if (isVal(x) && negativeSet.has(x)) return undefined
                                //if (isNotVal(x) && positiveSet.has(x.exp)) return undefined

                                res.filter(x => isVal(x)).forEach(x => outerAndPositive.push(x))
                                res.filter(x => isNotVal(x)).forEach(x => outerAndNegative.push(x.exp))      
                                
                                
                                
                                result = [...result, ...res]

                            } else {
                                 
                                if (isVal(res) && negativeSet.has(res)) {
                                    //console.log(";;;\n\n\n")
                                    //return undefined
                                }
                                //if (isNotVal(res) && positiveSet.has(res.exp)) return undefined
                                
                                
                                result = [...result, res]
                                
                            }

                            //console.log(outerAndPositive)
                           
                            

                        } else {
                            return undefined
                        }
                        
                        i++
                    } 
                    tryOuterAndPositive.forEach(x => outerAndPositive.push(x))
                    tryOuterAndNegative.forEach(x => outerAndNegative.push(x))

                    return result 

                }

                let result = []

                let attempts = 0

                while(!toStop()) {
                    attempts++
                    result = solveRest()
                    if (!result) {

                        let j = 0
                        while (true) {
                            positions[j]++
                            if (positions[j] > limits[j]) {
                                positions[j] = 1
                                j++
                            } else break
                        }
                    } else {
                        return and(...[...extra, ...result])
                    }

                } 

                return undefined    
            }

            if (exp.op === 'or'){
                let count = 0
                for (x of exp.data) {
                    const tryOuterAndPositive = structuredClone(outerAndPositive)
                    const tryOuterAndNegative = structuredClone(outerAndNegative)

                    const solved = checkContradiction(x, tryOuterAndPositive, tryOuterAndNegative)
                    if (solved) {
                        count++
                        if (count === k) {

                            tryOuterAndPositive.forEach(x => outerAndPositive.push(x))
                           tryOuterAndNegative.forEach(x => outerAndNegative.push(x))

                            console.log("\n\n\n\n\n\nsolved = " + show(solved))
                            console.log("outer negatives = " + outerAndNegative)
                            console.log("outer positives = " + outerAndPositive)
                            return solved
                        }
                    } else {
                        console.log("\n\n\n\n\n\n not solved")
                    }
                }
            } 
        }

        const evaluate = (exp, input) => {
            if (!exp.op) return input[exp - 1]
            if (exp.op === 'and') return exp.data.map(x => evaluate(x, input)).reduce((a, b) => a && b)
            if (exp.op === 'or') return exp.data.map(x => evaluate(x, input)).reduce((a, b) => a || b)
            if (exp.op === 'not') return !(evaluate(exp.exp, input))
        }

        const show = (exp) => {
            if (!exp) return "not found"
            if (!exp.op)  return "$" + exp
            if (exp.op === 'and') return `${exp.data.map(x => show(x)).join('')}`
            if (exp.op === 'or') return `(${exp.data.map(x => show(x)).join(' + ')})`
            if (exp.op === 'not') return ` -(${show(exp.exp)}) `
        }
    </script>
