<html>
    <body></body>
    <script>
        const range = (from, to) => Array(to - from).fill(0).map((_, i) => i + from)

        const indicies = (sample) => sample.map((x, i) => x > 0 ? i : null).filter(x => x !== null)

        const pulse = (triple, t) => {
            const [on, off, phase] = triple
            return (phase + t) % (on + off) < on ? 1 : 0
        }

        const sum = (pulses, t) => pulses.map(triple => pulse(triple, t)).reduce((a, b) => a + b)
        

        const sample12bit = (signal) => {
            return signal.map(x => {
                const point = Math.ceil(signal / 4096).toString(2)
                return [...Array(12 - point.length).fill(0), ...point.split().map(bit => bit === "1" ? 1 : 0)]
            }).flat()
        }

        const sample1bit = (signal, threshold) => {
            return signal.map(x => x >= threshold ? 1 : 0)
        }

        class AbstractEntropyEnumerator {
            constructor (windowInitiationLength = 4096, windowGenerateLength = 512, threshold1bitSelection = 1, threshold1bitSampling = 20) {
                if (new.target === AbstractEntropyEnumerator) throw "abstract"
                this.windowInitiationLength = windowInitiationLength
                this.windowGenerateLength = windowGenerateLength
                this.threshold1bitSelection = threshold1bitSelection
                this.threshold1bitSampling = threshold1bitSampling
            }

            windowInitiationLength;
            windowGenerateLength;
            threshold1bitSelection;
            threshold1bitSampling;

            async xorCombine (acc, whitened) { throw "not implemented"}

            async whiten (sample) { throw "not implemented"}

            filterToWindow = async (sample, window) =>  { throw "not implemented"}

            report = (what, points) =>  { }

            async * cfgsInitiation() { throw "not implemented"}
            async * cfgsGenerate() { throw "not implemented"}
            async * cfgsSelection() { throw "not implemented"}
            async * timeLimit() { throw "not implemented"}

            async * enumerateEntropy () {
                for await (let limit of this.timeLimit()) {
                    for await (let selectionCfg of this.cfgsSelection()) {
                        
                    
                        const rawSelectionUnderlyingSignal = range(0, limit).map(t => sum(selectionCfg, t))

                        const rawSelectionSample = sample1bit(rawSelectionUnderlyingSignal, this.threshold1bitSelection)
                        
                        const selectionSample = await this.filterToWindow(rawSelectionSample, this.windowGenerateLength)

                        this.report("selection", rawSelectionUnderlyingSignal)
                        const selections = indicies(selectionSample)

                        if (selections < 3) throw `not enough events in ${selectionSample}`

                        const [initiationWindow, ...generationWindows] = selections

                        for await (let initiationCfg of this.cfgsInitiation()) {
                            const initiationSignal = range(initiationWindow,  initiationWindow + this.windowInitiationLength).map(t => sum(initiationCfg, t))
                            const initiationSample = sample12bit(initiationSignal)

                            this.report("init-signal", initiationSignal)
                            
                                    
                            let entropyAcc = await this.whiten(initiationSample, true)

                            yield entropyAcc

                            for await (let generateCfg of this.cfgsGenerate()) {
                                for (let generateWindow of generationWindows) {
                                    const samplingSignal = range(generateWindow,  generateWindow + this.windowGenerateLength).map(t => sum(generateCfg, t))
                                    this.report("sample-signal", samplingSignal)
                                    const genSample = sample1bit(samplingSignal, this.threshold1bitSampling)
                                    entropyAcc = await this.xorCombine(entropyAcc, await this.whiten(genSample))
                                    yield entropyAcc
                                }
                            }
                        }
                    }
                }
            }
        }
    </script>
    <script>
        document.body.style.backgroundColor = "black"
        const p = () => {
            const pre = document.createElement("pre")
            pre.style.userSelect = "none"
            pre.style.color = "green"
            document.body.appendChild(pre)
            return (text, color = "green") => {
                pre.style.color = color
                pre.textContent = text + "\n"
            }
        }

        
        const plot = (width, height) => {
            const canvas = document.createElement("canvas")
            canvas.width = width
            canvas.height = height
            const ctx = canvas.getContext('2d')
            ctx.fillStyle='black';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            document.body.appendChild(canvas)

            return (points, color = "green") => {
                
                ctx.fillStyle='black';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.rect(0,0,canvas.width,canvas.height)
                ctx.stroke();
                ctx.moveTo(0, canvas.height);
                

                const scale = Math.max(...points)
                let t = 0
                for (point of points) {
                    const margin = 0.1
                    ctx.lineTo(t * canvas.width / (points.length  - 1), canvas.height - (1.0 - 2 * margin) * points[t-1] * (canvas.height) / scale - margin * canvas.height);
                    ctx.lineTo(t * canvas.width / (points.length  - 1), canvas.height - (1.0 - 2 * margin) * point * (canvas.height) / scale - margin * canvas.height);   
                    t++
                }
                ctx.stroke();
                
            }
        }


        const initiationLegend = p()
        const initiationPlot = plot(500, 200)

        const samplingLegend = p()
        const samplingPlot = plot(500, 200)

        const selectionLegend = p()
        const selectionPlot = plot(500, 200)
        //plot1([5, 4, 5, 7], "red")
        
        const entropyLegend = p()
        const entropyPlot = plot(500, 200)

        const colors = {
            init: "white", sample: "yellow", select: "lightblue"
        }

        initiationLegend("Init-wave (e.g. avalanche)", colors.init)

        samplingLegend("Sample-wave (e.g. thermal)", colors.sample)

        selectionLegend("Select-wave (e.g. white), first 100 points", colors.select)

        entropyLegend("Entropy")

    </script>
    <script>

        const testLegend = p()
        testLegend("Sine construction: ")

        testPlot = plot(500, 200)

        const genTriangle = (k, margin = 0, phase = 0) => Array(k).fill([]).map((_, i) => [2 * i, 2 * (k - i) + margin, i + phase])
        
        const genSmoothTriangle = (k, phase = 0) => Array(k).fill([]).map((_, i) => genTriangle(i, 3 * k - 2 * i, 2 * i + phase)).flat()

        const genSpectra = (pairs) => pairs.map(pair => Array(pair[2] ?? 1).fill([]).map((_) => genSmoothTriangle(pair[0], pair[1]))).flat(2)
        
        testPlot(Array(1000).fill(0).map((_, t) => sum(genSpectra([[400, 50, 1], [40, 50, 1]]), t)))

    <script>

        function bigintToUint8Array(value) {
            const hex = value.toString(16);
            const len = Math.ceil(hex.length / 2);
            const u8 = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                u8[len - i - 1] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return u8;
        }

        function vonNeumann(bits) {
            const out = [];
            for (let i = 0; i + 1 < bits.length; i += 2) {
                const a = bits[i];
                const b = bits[i + 1];
                if (a !== b) out.push(a);
            }
            return out;
        }

        function xorPreFold(bits) {
            const out = Buffer.alloc(32, 0);
            for (let i = 0; i < bits.length; ++i) {
                const byteIdx = (i >>> 3) % 32;
                const bitIdx  = i & 7;
                out[byteIdx] ^= (bits[i] << bitIdx);
            }
            return out;
        }

        class MockEntropyEnumerator extends AbstractEntropyEnumerator {
            
            async xorCombine (acc, whitened) { return acc.map((v, i) => (v + whitened[i]) % 2)}

            async whiten (sample, isThermal) {
                if (isThermal) {
                    //buffer = xorPreFold(vonNeumann(sample))
                }
                if (crypto.subtle) {
                    const sampleAsInt = BigInt("0b" + sample.map(x => x === 1 ? "1" : "0").join(""))
                    const buffer = bigintToUint8Array(sampleAsInt).buffer;
                    const sha256 = await crypto.subtle.digest('SHA-256', buffer)     
                    const decode = new Uint8Array(sha256).map(e => e.toString(16).padStart(2, 0)).join('')
                    const bigint = BigInt("0x" + decode).toString(2)
                    const result = bigint.split("").map(x => x === "1" ? 1 : 0) ;
                    return result
                } else {
                    const out = sample.slice(0, 256)
                    return [...Array(256 - out.length).fill(0), ...out]
                } 
            }

            report = (what, points) => {
                ({
                    "selection": () => selectionPlot(points.slice(0, 100), colors.select),
                    "init-signal": () => initiationPlot(points, colors.init),
                    "sample-signal": () => samplingPlot(points, colors.sample)
                })[what]()
            }

            filterToWindow = async (sample, windowLength) =>  { 
                const target = []
                for (let i = 0; i < sample.length; i += windowLength) {
                    const chunk = sample.slice(i, i + windowLength)
                    const mark = chunk.findIndex(x => x > 0)
                    if (mark !== -1) {
                        target[i + mark] = 1
                    } 
                }
                return target.map(x => x ?? 0)
            }

            async * cfgsInitiation() { 
                yield genSmoothTriangle(5)
            }
            async * cfgsGenerate() { 
                yield genSmoothTriangle(30)
            }
            async * cfgsSelection() { 
                yield genSmoothTriangle(30)
            }
            async * timeLimit() { 
                yield 3000
            }

        }

    </script>

    <script>
        (async () => {
            const generator = new MockEntropyEnumerator(19, 255)

            const toArray = async (generator, upTo = 1) => {

    </script>
   <script type="module">

    import * as btc from "./bitcoinjs-lib.js"

    const NETWORK          = bitcoin.networks.bitcoin       
    const COIN_TYPE        = 0;           // 0 = BTC mainnet, 1 = testnet
    const ACCOUNT          = 0;           // default account
    const CHANGE           = 0;           // 0 = external (receive) chain
    const NUM_ADDRESSES    = 20; 


    function deriveAddress(node, index, purpose) {
        // BIP‑44 path: m / purpose' / coin_type' / account' / change / address_index
        const path = `m/${purpose}'/${COIN_TYPE}'/${ACCOUNT}'/${CHANGE}/${index}`;
        const child = node.derivePath(path);

        const derive = purpose !== 44 ? bitcoin.payments.p2wpkh : bitcoin.payments.p2pkh
        const d = derive({
            pubkey: child.publicKey,
            network: NETWORK,
        });

        if (purpose === 49) {
            const { address } = bitcoin.payments.p2sh({
                redeem: d,
                network: bitcoin.networks.bitcoin,
            });
            return address
        }
        return d.address
    }


    function getAddressesFromSeed(seed) {
        // Buffer (or any Uint8Array‑compatible object)
        const root = bip32.fromSeed(seed, NETWORK);
        const addresses = [];

        for (let i = 0; i < NUM_ADDRESSES; i++) {
            addresses.push(deriveAddress(root, i, 44));
            addresses.push(deriveAddress(root, i, 49));
            addresses.push(deriveAddress(root, i, 84));
        }

        return addresses
    }


    const pk = p();
    const addr = p();

    const target = "bc1qekvmkczge3hxrvwdf2lj3yyvgjnparn3fdf9lg";

    (async () => {
        const initWindow = 255 // 4096
        const samplingWindow = 20000
        const generator = new MockEntropyEnumerator(initWindow, samplingWindow)

        const toArray = async (generator, upTo = 1) => {
            const arr = []
            let i = 0
            for await (el of generator) {
                arr.push(el)
                if (++i > upTo) return arr
            }
            return arr
        }
        
        pk("pk", "red")
        for await (let entropy of generator.enumerateEntropy()) {
            pk("pk", "yellow")
            const sampleAsInt = BigInt("0b" + entropy.map(x => x === 1 ? "1" : "0").join(""))
            const buffer =  bigintToUint8Array(sampleAsInt).buffer
            const secret = "0x" + sampleAsInt.toString(16)
            pk("secret: " + secret, "red")
            const addresses = getAddressesFromSeed(new Uint8Array((buffer)))
            addr(addresses.join("\n"))

            if (addresses.some(addr => addr === target)) {
                addr("found: " + target)
                console.log(secret)
            }
        }

    })()
